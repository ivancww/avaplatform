<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AVA">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="192x192" href="./ava-192.png">
  <link rel="stylesheet" href="./design-system/tokens.css">
  <link rel="stylesheet" href="./design-system/components.css">
  <title>安裝 AVA Platform</title>
  <script src="./ava-lifecycle.js"></script>
  <script>if (AVALifecycle.isStandalone()) location.replace("./");</script>
  <style>
    body { min-width: 0; }
    .install-stage { display: grid; min-height: 100vh; min-height: 100dvh; place-items: center; padding-top: max(var(--ava-page-padding-block), env(safe-area-inset-top)); }
    .install-card { width: min(100%, 480px); margin-inline: auto; padding: clamp(var(--ava-space-24), 5vw, var(--ava-space-32)); text-align: center; }
    .install-brand { display: grid; justify-items: center; gap: var(--ava-space-8); margin-bottom: var(--ava-space-24); }
    .install-logo { width: 88px; height: 88px; border-radius: 22px; }
    .install-brand-name { margin: 0; color: var(--ava-color-brand); font-size: var(--ava-type-section); font-weight: var(--ava-weight-extrabold); }
    .install-brand-subtitle { margin: 0; color: var(--ava-color-text-secondary); font-size: var(--ava-type-support); }
    .install-copy { display: grid; gap: var(--ava-space-12); margin-bottom: var(--ava-space-24); }
    .install-steps { display: grid; gap: var(--ava-space-8); margin: 0 0 var(--ava-space-20); padding: 0; list-style: none; text-align: left; }
    .install-step { display: grid; grid-template-columns: 32px minmax(0, 1fr); align-items: center; gap: var(--ava-space-12); min-width: 0; padding: var(--ava-space-12); border-radius: var(--ava-control-radius); background: var(--ava-color-background); }
    .install-step-number { display: grid; width: 32px; height: 32px; place-items: center; border-radius: 50%; color: var(--ava-color-brand); background: var(--ava-color-brand-soft); font-weight: var(--ava-weight-bold); }
    .install-step-copy { min-width: 0; overflow-wrap: anywhere; }
    .install-actions { display: grid; gap: var(--ava-space-8); }
    .install-status { min-height: 1.6em; margin: var(--ava-space-12) 0 0; color: var(--ava-color-text-secondary); font-size: var(--ava-type-caption); overflow-wrap: anywhere; }
  </style>
</head>
<body class="ava-shell">
  <main class="ava-container install-stage">
    <section class="ava-card install-card" aria-labelledby="installTitle">
      <header class="install-brand">
        <img class="install-logo" src="./ava-192.png" alt="AVA">
        <p class="install-brand-name">AVA Platform</p>
        <p class="install-brand-subtitle">AVA Agent Solutions</p>
      </header>

      <div class="install-copy">
        <h1 class="ava-page-title" id="installTitle">將 AVA 加到主畫面</h1>
        <p class="ava-support" id="installDescription">安裝 AVA 後，從主畫面開啟，開始使用你的 AVA Platform。</p>
      </div>

      <ol class="install-steps" id="installSteps" aria-label="安裝步驟"></ol>

      <div class="install-actions">
        <button class="ava-button ava-button--primary" id="installButton" type="button" hidden>安裝 AVA</button>
      </div>
      <p class="install-status" id="installStatus" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script>
    const isApple = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const steps = document.getElementById("installSteps");
    const installButton = document.getElementById("installButton");
    const installStatus = document.getElementById("installStatus");
    const fallbackSteps = isApple
      ? ["按 Safari「分享」", "選擇「加入主畫面」", "從主畫面開啟 AVA"]
      : ["開啟瀏覽器選單", "選擇「安裝應用程式」或「加到主畫面」", "從主畫面開啟 AVA"];

    function renderSteps(items) {
      steps.replaceChildren(...items.map((copy, index) => {
        const row = document.createElement("li");
        row.className = "install-step";
        const number = document.createElement("span");
        number.className = "install-step-number";
        number.textContent = String(index + 1);
        const text = document.createElement("span");
        text.className = "install-step-copy";
        text.textContent = copy;
        row.append(number, text);
        return row;
      }));
    }

    renderSteps(fallbackSteps);

    let installPrompt = null;
    if (!isApple) {
      addEventListener("beforeinstallprompt", event => {
        event.preventDefault();
        installPrompt = event;
        installButton.hidden = false;
        renderSteps(["按下方「安裝 AVA」", "確認瀏覽器安裝提示", "從主畫面開啟 AVA"]);
      });
      addEventListener("appinstalled", () => {
        installPrompt = null;
        installButton.hidden = true;
        installStatus.textContent = "AVA 已安裝。請從主畫面開啟。";
      });
    }

    installButton.addEventListener("click", async () => {
      if (!installPrompt) return;
      const prompt = installPrompt;
      installPrompt = null;
      installButton.disabled = true;
      try {
        await prompt.prompt();
        await prompt.userChoice;
      } finally {
        installButton.disabled = false;
        installButton.hidden = true;
      }
    });

  </script>
</body>
</html>
