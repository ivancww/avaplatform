<title id="t">AVA User Edit states — conceptual reference</title><desc id="d">Three conceptual examples: frontend, edit and preview. Not an actual application screenshot or QA evidence.</desc>
<rect width="1200" height="585" fill="#f6f8fb"/><g font-family="system-ui, PingFang HK, sans-serif" fill="#172033">
<text x="30" y="38" font-size="22" font-weight="700">統一 User Edit 介面概念參考 · 非實際 App 畫面</text>
<g transform="translate(25 70)"><text x="0" y="0" font-size="18" font-weight="700">1. 正常使用</text><rect y="18" width="365" height="450" rx="16" fill="#fff" stroke="#e7ebf1"/><text x="18" y="48" font-size="15" font-weight="700">AVA App</text><text x="100" y="48" font-size="12" fill="#475569">v1.0.0</text><rect x="245" y="24" width="102" height="44" rx="9" fill="#fff" stroke="#64748b"/><text x="255" y="51" font-size="14">← 返回 AVA</text><line x1="0" y1="78" x2="365" y2="78" stroke="#e7ebf1"/><text x="18" y="112" font-size="14" fill="#475569">← 返回</text><rect x="18" y="136" width="329" height="225" rx="16" fill="#fff" stroke="#e7ebf1"/><text x="38" y="174" font-size="19" font-weight="700">客戶對話標題</text><text x="38" y="207" font-size="15" fill="#475569">原有銷售流程與資料</text><rect x="38" y="238" width="220" height="44" rx="10" fill="#eff6ff"/><text x="54" y="266" font-size="15">客戶選項</text></g>
<g transform="translate(417 70)"><text x="0" y="0" font-size="18" font-weight="700">2. 編輯模式</text><rect y="18" width="365" height="450" rx="16" fill="#fff" stroke="#e7ebf1"/><text x="18" y="48" font-size="15" font-weight="700">AVA App</text><text x="100" y="48" font-size="12" fill="#475569">v1.0.0</text><rect x="245" y="24" width="102" height="44" rx="9" fill="#fff" stroke="#64748b"/><text x="255" y="51" font-size="14">← 返回 AVA</text><rect x="16" y="82" width="333" height="48" rx="8" fill="#eff6ff"/><text x="27" y="111" font-size="14" font-weight="700">編輯模式</text><text x="109" y="111" font-size="14">預覽　儲存修改　取消修改</text><text x="19" y="156" font-size="13" fill="#475569">直接修改可自訂內容；官方資料受保護。</text><rect x="18" y="177" width="329" height="205" rx="16" fill="#fff" stroke="#e7ebf1"/><rect x="36" y="198" width="290" height="48" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="48" y="228" font-size="16">客戶對話標題　編輯</text><path d="M294 221l11-11 4 4-11 11-5 1z" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round"/><text x="38" y="281" font-size="14" fill="#475569">官方資料・不可修改</text><text x="38" y="309" font-size="15">原有產品及計算內容</text></g>
<g transform="translate(809 70)"><text x="0" y="0" font-size="18" font-weight="700">3. 預覽</text><rect y="18" width="365" height="450" rx="16" fill="#fff" stroke="#e7ebf1"/><text x="18" y="48" font-size="15" font-weight="700">AVA App</text><text x="100" y="48" font-size="12" fill="#475569">v1.0.0</text><rect x="245" y="24" width="102" height="44" rx="9" fill="#fff" stroke="#64748b"/><text x="255" y="51" font-size="14">← 返回 AVA</text><rect x="16" y="82" width="333" height="48" rx="8" fill="#eff6ff"/><text x="27" y="111" font-size="14" font-weight="700">預覽</text><text x="109" y="111" font-size="14">返回編輯　儲存修改</text><rect x="18" y="177" width="329" height="205" rx="16" fill="#fff" stroke="#e7ebf1"/><text x="38" y="218" font-size="19" font-weight="700">修改後的對話標題</text><text x="38" y="252" font-size="15" fill="#475569">原有產品及計算內容</text><text x="38" y="289" font-size="14" fill="#475569">預覽未儲存</text></g>
<text x="30" y="555" font-size="13" fill="#475569">示意圖不代表固定版面、實際資料或已完成測試。視窗縮窄時標頭及按鈕會換行。</text></g></svg>
