<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opening 5Pay…</title>
</head>
<body>
<p id="loading" role="status">正在開啟 5Pay 控制台…</p>
<script>
(async function load5PayRuntime(){
  "use strict";
  const params=new URLSearchParams(location.search);
  const mode=params.get("mode");
  if(mode!=="user"&&mode!=="admin"){
    document.getElementById("loading").textContent="無效的 5Pay 入口。";
    throw new Error("Invalid 5Pay entry mode");
  }
  const runtimeUrl=new URL("/5pay/",location.origin);
  console.info(`[5Pay] Entry mode received: ${mode}`);
  try{
    const response=await fetch(runtimeUrl,{credentials:"same-origin",cache:"no-cache"});
    if(!response.ok)throw new Error(`5Pay runtime returned HTTP ${response.status}`);
    let source=await response.text();
    const originalSource=source;
    const bridgeUrl=new URL("5pay-entry.js",location.href).href;
    const boot=`<base href="${runtimeUrl.href}"><script>window.__AVA_5PAY_ENTRY_MODE=${JSON.stringify(mode)};<\/script><script src="${bridgeUrl}" defer><\/script>`;
    source=source.replace(/<head([^>]*)>/i,`<head$1>${boot}`);
    if(source===originalSource)throw new Error("5Pay runtime has no document head");
    document.open();document.write(source);document.close();
  }catch(error){
    document.getElementById("loading").textContent="無法載入 5Pay 控制台；沒有退回客戶 Frontend。";
    console.error("[5Pay] Runtime load failed",error);
  }
})();
</script>
</body>
</html>
