<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./ava-192.png"><title>安裝 AVA</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK",sans-serif;color:#172033;background:#f6f8fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.gateway{width:min(560px,100%);background:#fff;border:1px solid #e7ebf1;border-radius:24px;padding:clamp(24px,6vw,44px);box-shadow:0 18px 45px #17203314}.brand{font-weight:800;color:#2563eb}.icon{width:74px;height:74px;border-radius:20px;margin:24px 0 18px}h1{font-size:clamp(28px,6vw,38px);margin:0 0 12px}p{color:#718096;line-height:1.6}.steps{display:grid;gap:12px;margin:24px 0}.step{display:flex;gap:14px;padding:15px;background:#f8fafc;border-radius:14px}.number{display:grid;place-items:center;width:32px;height:32px;flex:0 0 32px;border-radius:50%;background:#eff6ff;color:#2563eb;font-weight:800}button{width:100%;min-height:48px;border:0;border-radius:12px;background:#2563eb;color:#fff;font:700 16px inherit;padding:12px;cursor:pointer}.hint{text-align:center;font-size:12px;margin-bottom:0}</style></head><body><main class="gateway"><div class="brand">AVA Platform</div><img class="icon" src="./ava-192.png" alt="AVA"><h1 id="title">安裝 AVA</h1><p id="lead">AVA 必須從主畫面開啟，才會開始初始化。此頁不會建立 User 或載入 Apps。</p><div class="steps" id="steps"></div><button id="installButton" hidden>安裝 AVA</button><p class="hint">裝好後，請由主畫面的 AVA Icon 開啟。</p></main><script src="ava-lifecycle.js"></script><script>if(AVALifecycle.isStandalone()){location.replace("./")}const apple=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);const steps=document.getElementById("steps"),button=document.getElementById("installButton");function render(items){steps.replaceChildren(...items.map((copy,index)=>{const row=document.createElement("div");row.className="step";const number=document.createElement("span");number.className="number";number.textContent=index+1;const text=document.createElement("div");text.textContent=copy;row.append(number,text);return row}))}if(apple){document.getElementById("title").textContent="將 AVA 加到主畫面";render(["按 Safari 的「分享」按鈕","選擇「加入主畫面」","從主畫面開啟 AVA"])}else{render(["按下方「安裝 AVA」；如沒有按鈕，請開啟瀏覽器選單","選擇「安裝應用程式」或「加到主畫面」","從主畫面開啟 AVA"])}let promptEvent;addEventListener("beforeinstallprompt",event=>{event.preventDefault();promptEvent=event;button.hidden=false});button.onclick=async()=>{if(!promptEvent)return;promptEvent.prompt();await promptEvent.userChoice;promptEvent=null;button.hidden=true};navigator.serviceWorker?.register("./sw.js",{scope:"./"});</script></body></html>
