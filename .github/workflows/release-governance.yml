name: Platform release governance

on:
  pull_request:
    paths:
      - "index.html"
      - "ava-admin-auth.js"
      - "platform-release.json"
      - "scripts/release-check.js"
      - "tests/**"
      - "docs/**"
      - ".github/workflows/release-governance.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "ava-admin-auth.js"
      - "platform-release.json"
      - "scripts/release-check.js"
      - "tests/**"
      - "docs/**"
      - ".github/workflows/release-governance.yml"

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate release identity and version policy
        run: node scripts/release-check.js
      - name: Run Platform release and security tests
        run: |
          node tests/release-governance.test.js
          node tests/version.test.js
          node tests/everbliss-integration.test.js
          node tests/user-return-routing.test.js
          node tests/browser-admin-entry.test.js
          node tests/ava-admin-auth.test.js
          node tests/browser-bound-admin-session.test.js
          node tests/medical-integration.test.js
          node tests/single-pwa-gateway.test.js
          node tests/workspace-registry.test.js
          node tests/workspace-gas.test.js
          node tests/workspace-cloud-write.test.js
          node tests/workspace-preferences.test.js
  workspace-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser QA dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Exercise Workspace against intercepted fixtures only
        run: node tests/workspace.browser.js
